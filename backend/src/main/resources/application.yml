server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deadlock}
    username: ${DB_USERNAME:deadlock}
    password: ${DB_PASSWORD:deadlock}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder}
            scope: user:email,read:user
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid,profile,email

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-that-is-at-least-32-characters-long-change-in-production}
    expiration-ms: 86400000
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:deadlock}
    secret-key: ${S3_SECRET_KEY:deadlock123}
    bucket: ${S3_BUCKET:deadlock-problems}
    region: ${S3_REGION:us-east-1}
